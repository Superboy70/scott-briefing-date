<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0806">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<title>마계 성전</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="game"></canvas>

<!-- 터치 컨트롤 -->
<div id="controls" class="hidden">
  <div id="dpad">
    <div class="dkey" data-dir="left">◀</div>
    <div class="dkey" data-dir="right">▶</div>
  </div>
  <div id="actions">
    <div class="btn small" data-key="s1" id="btn-s1"><span class="lbl">스킬1</span><span class="sub" id="s1-name"></span></div>
    <div class="btn small" data-key="s2" id="btn-s2"><span class="lbl">스킬2</span><span class="sub" id="s2-name"></span></div>
    <div class="btn big atk" data-key="attack"><span class="lbl">공격</span></div>
    <div class="btn big jmp" data-key="jump"><span class="lbl">점프</span></div>
  </div>
  <div id="potions">
    <div class="btn pot hp" data-key="hpPot"><span class="lbl">♥</span><span class="cnt" id="hp-cnt">0</span></div>
    <div class="btn pot mp" data-key="mpPot"><span class="lbl">✦</span><span class="cnt" id="mp-cnt">0</span></div>
  </div>
  <div class="btn menu" data-key="menu">☰</div>
</div>

<!-- 메뉴/화면 오버레이 -->
<div id="ui"></div>
<div id="toast"></div>

<div id="rotate">
  <div>📱↻</div>
  <p>가로 모드로 돌려주세요</p>
</div>

<script src="js/audio.js"></script>
<script src="js/data.js"></script>
<script src="js/items.js"></script>
<script src="js/world.js"></script>
<script src="js/entities.js"></script>
<script src="js/render.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
