name: Build Demon Crusade APK
on:
  push:
    paths:
      - 'demon-crusade/**'
      - '.github/workflows/build-demon-crusade-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: demon-crusade
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Check Android SDK
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls "$ANDROID_HOME/platforms" || true

      - name: Install dependencies
        run: npm install

      - name: Create and patch Android project
        run: |
          npx cap add android
          node scripts/patch-android.mjs
          npx cap sync android

      - name: Build signed release APK
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk ../demon-crusade.apk
          "$ANDROID_HOME"/build-tools/*/apksigner verify --print-certs ../demon-crusade.apk | head -3 || true

      - uses: actions/upload-artifact@v4
        with:
          name: demon-crusade-apk
          path: demon-crusade/demon-crusade.apk

      - name: Publish to release (demon-crusade-latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: demon-crusade-latest
          name: 마계 성전 (최신 빌드)
          prerelease: true
          files: demon-crusade/demon-crusade.apk
          body: |
            마계 성전 Android APK (Android 13~16 대응, minSdk 24 / targetSdk 36)
            버전 1.1.0.${{ github.run_number }} · 고정 키로 서명된 릴리스 빌드 (이후 업데이트는 기존 앱 위에 바로 설치됨)
            ※ 1.0(디버그 빌드)을 설치했던 경우 한 번만 기존 앱을 삭제 후 설치하세요.
            브랜치: ${{ github.ref_name }} · 커밋: ${{ github.sha }}
